[project]
name = "econolens"
version = "0.1.0"
description = "実体経済イベント駆動型 株価予測・シミュレーションツール (Phase 0-1: 定量予測ベースライン)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "numpy>=1.26",
    "plotly>=5.22",
]

[project.scripts]
econolens = "econolens.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["econolens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
